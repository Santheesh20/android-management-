<div class="p-8">

  <div class="mb-7">
    <h1 class="text-2xl font-bold text-white">
      Dashboard Overview
    </h1>

    <p class="text-sm text-[#94a3b8] mt-1">
      Monitor your TV launcher system performance
    </p>
  </div>

  <div class="grid grid-cols-4 gap-5 mb-6">
    <div *ngFor="let stat of stats"
      class="group relative overflow-hidden bg-[#0d1424] rounded-2xl border border-[rgba(185,134,104,0.12)] p-5 shadow-[0_4px_16px_rgba(0,0,0,0.3)] hover:-translate-y-1 hover:border-[rgba(185,134,104,0.38)] hover:shadow-[0_8px_28px_rgba(0,0,0,0.4),0_0_18px_rgba(185,134,104,0.06)] transition-all duration-300 ease-out">

      <i
        class="bi {{ stat.icon }} absolute -bottom-4 -right-4 text-[110px] text-[rgba(185,134,104,0.08)] pointer-events-none transition-all duration-500 ease-out group-hover:scale-110 group-hover:rotate-2 group-hover:text-[rgba(185,134,104,0.11)]"></i>

      <div class="relative z-10">
        <div class="flex items-center justify-between mb-4">

          <span
            class="w-10 h-10 rounded-xl bg-gradient-to-br flex items-center justify-center text-white text-lg shadow-md transition-all duration-300 ease-out group-hover:scale-105 group-hover:shadow-[0_0_16px_rgba(185,134,104,0.25)]"
            [ngClass]="stat.accent">
            <i class="bi {{ stat.icon }}"></i>
          </span>

          <span class="text-2xl font-bold text-white transition-all duration-300 group-hover:text-[#f1d2bd]">
            {{ stat.value }}
          </span>
        </div>

        <p class="text-sm font-medium text-[#cbd5e1]">
          {{ stat.label }}
        </p>

        <p class="text-xs text-[#64748b] mt-1">
          {{ stat.sub }}
        </p>
      </div>
    </div>
  </div>

  <div
    class="group bg-[#0d1424] rounded-2xl border border-[rgba(185,134,104,0.12)] shadow-[0_4px_16px_rgba(0,0,0,0.3)] p-6 hover:border-[rgba(185,134,104,0.22)] hover:shadow-[0_6px_22px_rgba(0,0,0,0.35)] transition-all duration-300">

    <div class="flex items-center justify-between mb-5">
      <h2 class="text-base font-semibold text-white flex items-center gap-2">
        <i class="bi bi-tv-fill text-[#b98668]"></i>
        Device List
      </h2>

      <a href="#"
        class="group/view flex items-center gap-1.5 text-xs font-semibold text-[#d9a988] border border-[rgba(185,134,104,0.35)] px-3.5 py-1.5 rounded-full hover:bg-[rgba(185,134,104,0.12)] hover:text-white hover:border-[rgba(185,134,104,0.6)] transition-all duration-200">
        View All
        <i class="bi bi-arrow-right text-xs transition-transform duration-200 group-hover/view:translate-x-1"></i>
      </a>
    </div>
    <app-data-table [columns]="deviceColumns" [data]="devices"></app-data-table>
  </div>
</div>
