<!-- Overlay -->
<div class="app-modal-overlay fixed inset-0 z-[2000] flex items-center justify-center bg-[#020617]/75 backdrop-blur-md p-6"
    (click)="onCancel()">

    <!-- Modal card -->
    <div class="app-modal-card w-full max-w-[560px] max-h-[90vh] bg-[#0d1424]/95 backdrop-blur-xl border border-[rgba(185,134,104,0.18)] rounded-2xl shadow-[0_24px_80px_rgba(0,0,0,0.65)] flex flex-col overflow-hidden"
        (click)="$event.stopPropagation()">

        <!-- Header -->
        <div class="flex items-start justify-between gap-4 px-7 py-5 border-b border-[rgba(185,134,104,0.12)] bg-[#101827]/80 shrink-0">

            <div class="flex items-center gap-3">
                <span class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#8a5a45] to-[#b98668] flex items-center justify-center text-white shadow-[0_4px_14px_rgba(185,134,104,0.22)] shrink-0">
                    <i class="bi bi-person-plus text-lg"></i>
                </span>

                <div>
                    <h2 class="text-lg font-bold text-white leading-tight">
                        Add New User
                    </h2>
                    <p class="text-xs text-[#94a3b8] mt-0.5">
                        Create a user account and assign an organization and role
                    </p>
                </div>
            </div>

            <button type="button" (click)="onCancel()" aria-label="Close"
                class="w-9 h-9 flex items-center justify-center rounded-lg text-[#64748b] hover:text-white hover:bg-[rgba(185,134,104,0.12)] transition-all duration-200 shrink-0">
                <i class="bi bi-x-lg"></i>
            </button>

        </div>


        <!-- Body -->
        <div class="px-7 py-6 space-y-6 overflow-y-auto">

            <!-- Email -->
            <div>
                <label class="block text-sm font-semibold text-[#e2e8f0] mb-1.5">
                    Email Address
                    <span class="text-[#b98668]">*</span>
                </label>

                <input type="email" [(ngModel)]="email" name="email"
                    placeholder="user@example.com"
                    class="w-full h-11 px-4 rounded-xl bg-[#101827] border text-sm text-[#f1f5f9] placeholder:text-[#64748b] outline-none focus:ring-2 transition-all duration-200"
                    [ngClass]="isEmailInvalid
                        ? 'border-red-500/60 focus:border-red-500 focus:ring-red-500/15'
                        : 'border-[rgba(185,134,104,0.16)] focus:border-[#b98668] focus:ring-[rgba(185,134,104,0.12)]'" />

                <p class="text-xs mt-1.5" [ngClass]="isEmailInvalid ? 'text-red-400' : 'text-transparent'">
                    Email is required.
                </p>
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm font-semibold text-[#e2e8f0] mb-1.5">
                    Password
                    <span class="text-[#b98668]">*</span>
                </label>

                <input type="password" [(ngModel)]="password" name="password"
                    placeholder="Enter a temporary password"
                    class="w-full h-11 px-4 rounded-xl bg-[#101827] border text-sm text-[#f1f5f9] placeholder:text-[#64748b] outline-none focus:ring-2 transition-all duration-200"
                    [ngClass]="isPasswordInvalid
                        ? 'border-red-500/60 focus:border-red-500 focus:ring-red-500/15'
                        : 'border-[rgba(185,134,104,0.16)] focus:border-[#b98668] focus:ring-[rgba(185,134,104,0.12)]'" />

                <p class="text-xs mt-1.5" [ngClass]="isPasswordInvalid ? 'text-red-400' : 'text-transparent'">
                    Password is required.
                </p>
            </div>

            <!-- Organization + Role -->
            <div class="grid grid-cols-2 gap-4">

                <div>
                    <app-dropdown label="Organization *" placeholder="Select organization"
                        [options]="organizationOptions" [value]="organization"
                        (valueChange)="setOrganization($event)">
                    </app-dropdown>
                    <p class="text-xs mt-1.5" [ngClass]="isOrganizationInvalid ? 'text-red-400' : 'text-transparent'">
                        Required.
                    </p>
                </div>

                <div>
                    <app-dropdown label="Role *" placeholder="Select role"
                        [options]="roleOptions" [value]="role"
                        (valueChange)="setRole($event)">
                    </app-dropdown>
                    <p class="text-xs mt-1.5" [ngClass]="isRoleInvalid ? 'text-red-400' : 'text-transparent'">
                        Required.
                    </p>
                </div>

            </div>

        </div>


        <!-- Footer -->
        <div class="flex items-center gap-3 px-7 py-5 border-t border-[rgba(185,134,104,0.12)] bg-[#101827]/80 shrink-0">

            <button type="button" (click)="onCancel()"
                class="flex-1 h-11 rounded-xl border border-[rgba(185,134,104,0.16)] bg-[#0d1424] text-sm font-semibold text-[#94a3b8] hover:text-white hover:bg-[#151f32] transition-all duration-200">
                Cancel
            </button>

            <button type="button" (click)="onSubmit()"
                class="flex-1 h-11 rounded-xl text-sm font-semibold text-white bg-gradient-to-r from-[#8a5a45] to-[#b98668] shadow-[0_4px_14px_rgba(185,134,104,0.25)] hover:-translate-y-0.5 hover:shadow-[0_8px_24px_rgba(185,134,104,0.35)] transition-all duration-200">
                <i class="bi bi-plus-lg mr-2"></i>
                Create User
            </button>

        </div>

    </div>

</div>
