<div class="p-8">

    <app-page-header title="Application Management" description="Manage the apps available on your TV launcher">
    </app-page-header>

    <!-- Page switcher -->
    <div class="flex items-center gap-2 mb-6">

        <a routerLink="/application-management" routerLinkActive="tab-active" [routerLinkActiveOptions]="{ exact: true }"
            #tabLibrary="routerLinkActive"
            class="h-10 px-5 rounded-xl text-sm font-semibold flex items-center transition-all duration-200 hover:scale-[1.04] active:scale-95"
            [ngClass]="tabLibrary.isActive
                ? 'bg-[#b98668] text-white shadow-[0_4px_16px_rgba(185,134,104,0.35)]'
                : 'bg-[#101827] text-[#94a3b8] border border-[rgba(185,134,104,0.12)] hover:text-white hover:border-[rgba(185,134,104,0.3)]'">
            App Library
        </a>

        <a routerLink="/application-management/auto-update" routerLinkActive="tab-active" #tabAutoUpdate="routerLinkActive"
            class="h-10 px-5 rounded-xl text-sm font-semibold flex items-center transition-all duration-200 hover:scale-[1.04] active:scale-95"
            [ngClass]="tabAutoUpdate.isActive
                ? 'bg-[#b98668] text-white shadow-[0_4px_16px_rgba(185,134,104,0.35)]'
                : 'bg-[#101827] text-[#94a3b8] border border-[rgba(185,134,104,0.12)] hover:text-white hover:border-[rgba(185,134,104,0.3)]'">
            Auto App Update
        </a>

        <a routerLink="/application-management/upload-apps" routerLinkActive="tab-active" #tabUpload="routerLinkActive"
            class="h-10 px-5 rounded-xl text-sm font-semibold flex items-center transition-all duration-200 hover:scale-[1.04] active:scale-95"
            [ngClass]="tabUpload.isActive
                ? 'bg-[#b98668] text-white shadow-[0_4px_16px_rgba(185,134,104,0.35)]'
                : 'bg-[#101827] text-[#94a3b8] border border-[rgba(185,134,104,0.12)] hover:text-white hover:border-[rgba(185,134,104,0.3)]'">
            Upload Apps
        </a>

    </div>

    <app-feature-card
        title="App Library"
        description="Browse and manage apps available to your TV devices"
        icon="bi-grid-3x3-gap">

        <app-empty-state
            icon="bi-grid-3x3-gap"
            title="No apps added yet"
            description="Your app library will appear here once apps are added.">
        </app-empty-state>

    </app-feature-card>

</div>
