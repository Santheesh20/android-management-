<div class="p-8">

  <app-page-header title="Login Activity" description="Track user login, logout, and authentication events">

    <div header-actions class="flex items-center gap-3">
      <button (click)="refresh()"
        class="flex items-center gap-2 text-sm font-medium text-[#cbd5e1] border border-[rgba(185,134,104,0.25)] px-4 py-2 rounded-lg hover:bg-[rgba(185,134,104,0.08)] hover:text-white transition-all duration-200">
        <i class="bi bi-arrow-clockwise"></i>
        Refresh
      </button>

      <button (click)="exportCSV()"
        class="flex items-center gap-2 text-sm font-medium text-white bg-gradient-to-br from-[#8a5a45] to-[#b98668] px-4 py-2 rounded-lg shadow-md hover:shadow-[0_0_16px_rgba(185,134,104,0.3)] hover:-translate-y-0.5 transition-all duration-200">
        <i class="bi bi-download"></i>
        Export CSV
      </button>
    </div>
  </app-page-header>

  <!-- Stat cards -->
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    <div *ngFor="let stat of stats"
      class="group bg-[#0d1424] rounded-2xl border border-[rgba(185,134,104,0.12)] shadow-[0_4px_16px_rgba(0,0,0,0.3)] p-5 flex items-center gap-3 transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_10px_28px_rgba(0,0,0,0.4)]"
      [ngClass]="stat.hoverBorder">

      <span
        class="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 transition-transform duration-300 group-hover:scale-110 border"
        [ngClass]="[stat.iconBg, stat.iconBorder, stat.iconColor]">
        <i class="bi {{ stat.icon }} text-lg"></i>
      </span>

      <div>
        <p class="text-xs text-[#94a3b8]">{{ stat.label }}</p>
        <p class="text-xl font-bold text-white mt-0.5">{{ stat.value }}</p>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div
    class="bg-[#0d1424] rounded-2xl border border-[rgba(185,134,104,0.12)] shadow-[0_4px_16px_rgba(0,0,0,0.3)] p-6 mb-6">

    <h2 class="text-sm font-semibold text-white flex items-center gap-2 mb-4">
      <i class="bi bi-funnel-fill text-[#b98668]"></i>
      Filters
    </h2>

    <div class="grid grid-cols-4 gap-4">

      <div class="relative">
        <i class="bi bi-search absolute left-3.5 top-1/2 -translate-y-1/2 text-[#64748b] text-sm"></i>
        <input type="text" [(ngModel)]="searchTerm" placeholder="Search by user email, IP address..."
          class="w-full bg-[#0b1220] border border-[rgba(185,134,104,0.15)] rounded-lg pl-10 pr-4 py-2.5 text-sm text-[#e2e8f0] placeholder-[#64748b] focus:outline-none focus:border-[rgba(185,134,104,0.5)] transition-colors" />
      </div>

      <app-dropdown [options]="activityTypeOptions" [value]="activityType" (valueChange)="onActivityTypeChange($event)">
      </app-dropdown>

      <input type="date" [(ngModel)]="dateFrom"
        class="w-full bg-[#0b1220] border border-[rgba(185,134,104,0.15)] rounded-lg px-4 py-2.5 text-sm text-[#e2e8f0] focus:outline-none focus:border-[rgba(185,134,104,0.5)] transition-colors [color-scheme:dark]" />

      <input type="date" [(ngModel)]="dateTo"
        class="w-full bg-[#0b1220] border border-[rgba(185,134,104,0.15)] rounded-lg px-4 py-2.5 text-sm text-[#e2e8f0] focus:outline-none focus:border-[rgba(185,134,104,0.5)] transition-colors [color-scheme:dark]" />
    </div>
  </div>

  <!-- Table -->
  <div class="bg-[#0d1424] rounded-2xl border border-[rgba(185,134,104,0.12)] shadow-[0_4px_16px_rgba(0,0,0,0.3)] p-6">

    <app-data-table *ngIf="filteredLogs.length; else noLogs" [columns]="columns" [data]="filteredLogs">
    </app-data-table>

    <ng-template #noLogs>
      <app-empty-state icon="bi-clock-history" title="No login activity found"
        description="Try adjusting your filters or search term.">
      </app-empty-state>
    </ng-template>

  </div>

</div>
